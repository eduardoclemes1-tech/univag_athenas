services:
  app:
    build: .
    network_mode: "service:db"
    environment:
      TZ: America/Cuiaba
      DB_HOST: 127.0.0.1
      DB_NAME: athenas
      DB_USER: athenas_app
      DB_PASSWORD: ${DB_PASSWORD:-athenas123}
      MATERIAL_STORAGE_DIR: /var/athenas_uploads
    volumes:
      - ./:/var/www/html
      - athenas_uploads:/var/athenas_uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  reminders:
    build: .
    network_mode: "service:db"
    command: ["php", "actions/workerLembretes.php"]
    environment:
      TZ: America/Cuiaba
      DB_HOST: 127.0.0.1
      DB_NAME: athenas
      DB_USER: athenas_app
      DB_PASSWORD: ${DB_PASSWORD:-athenas123}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    command:
      - "--bind-address=0.0.0.0"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=-04:00"
    ports:
      - "8000:80"
    environment:
      TZ: America/Cuiaba
      MYSQL_DATABASE: athenas
      MYSQL_USER: athenas_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-athenas123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    volumes:
      - athenas_db_data:/var/lib/mysql
      - ./sqlAthenas/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  athenas_db_data:
  athenas_uploads:
